<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Feedback Intelligence: recorded showcase and interactive local Workbench</title>
<desc id="desc">One React interface serves a frozen no-key showcase and an opt-in local tool. The API owns sessions, OAuth and a credential vault. PostgreSQL stores dataset, template and run snapshots plus leased jobs and immutable results. Python prepares feedback and executes rules or approved model inference. An outbox projects text-free exploratory results to ClickHouse. Hosted readiness and human calibration are separate gates.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#E86823"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#EDF0F5}.title{font-size:28px;font-weight:600}.label{font-size:19px;font-weight:600}.note{font-size:15px}.section{font-size:14px;letter-spacing:1.5px}.box{fill:#404040;stroke:#EDF0F5;stroke-width:1;rx:8}.line{fill:none;stroke:#E86823;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="860" fill="#2C2C2C"/>
<text x="40" y="52" class="title">From feedback to inspectable decisions</text>
<text x="40" y="82" class="note">Local tool and recorded showcase • explicit privacy, execution and evidence boundaries</text>
<rect class="box" x="40" y="118" width="1120" height="90"/>
<text x="60" y="151" class="label">Shared React + TypeScript interface</text>
<text x="60" y="182" class="note">Datasets → classification → runs → results → inspect / compare / export • responsive floating navigation</text>
<text x="40" y="251" class="section">RECORDED SHOWCASE / NO CREDENTIALS</text>
<rect class="box" x="40" y="274" width="300" height="105"/>
<text x="60" y="306" class="label">Evidence journey</text><text x="60" y="334" class="note">Overview → signals → decisions</text><text x="60" y="359" class="note">Hover/focus, pin, explicit drill-down</text>
<rect class="box" x="450" y="274" width="300" height="105"/>
<text x="470" y="306" class="label">.NET dashboard reads</text><text x="470" y="334" class="note">Versioned contracts and provenance</text><text x="470" y="359" class="note">Live eligibility stays calibration-gated</text>
<rect class="box" x="860" y="274" width="300" height="105"/>
<text x="880" y="306" class="label">Frozen synthetic fixtures</text><text x="880" y="334" class="note">480 records • SemIf / rules / Sol</text><text x="880" y="359" class="note">192 successful paid comparison cases</text>
<path class="line" d="M345 326H440"/><path class="line" d="M755 326H850"/>
<text x="40" y="426" class="section">OPT-IN LOCAL WORKBENCH / OWNER SESSION</text>
<rect class="box" x="40" y="450" width="300" height="118"/>
<text x="60" y="482" class="label">.NET API boundary</text><text x="60" y="510" class="note">Session, origin/CSRF, OAuth, vault</text><text x="60" y="535" class="note">Account catalog + effort validation</text><text x="60" y="556" class="note">Authenticated run-bound broker</text>
<rect class="box" x="450" y="450" width="300" height="118"/>
<text x="470" y="482" class="label">PostgreSQL canonical store</text><text x="470" y="510" class="note">Dataset / template / run snapshots</text><text x="470" y="535" class="note">Leases, fencing, immutable results</text><text x="470" y="556" class="note">Idempotent jobs + outbox</text>
<rect class="box" x="860" y="450" width="300" height="118"/>
<text x="880" y="482" class="label">Python processing</text><text x="880" y="510" class="note">Map, validate, prepare/redact</text><text x="880" y="535" class="note">Rules / approved Responses calls</text><text x="880" y="556" class="note">Model + effort retained per run</text>
<path class="line" d="M345 509H440"/><path class="line" d="M755 509H850"/>
<rect class="box" x="40" y="616" width="300" height="110"/>
<text x="60" y="648" class="label">Inspection and export</text><text x="60" y="675" class="note">PostgreSQL reads, UTC cohorts</text><text x="60" y="700" class="note">Shared-success agreement ≠ accuracy</text>
<rect class="box" x="450" y="616" width="300" height="110"/>
<text x="470" y="648" class="label">ClickHouse projection</text><text x="470" y="675" class="note">Text-free, deduplicated, run-scoped</text><text x="470" y="700" class="note">Exploratory facts kept separate</text>
<rect class="box" x="860" y="616" width="300" height="110"/>
<text x="880" y="648" class="label">Recovery and maintenance</text><text x="880" y="675" class="note">Partial successes, cancel / resume</text><text x="880" y="700" class="note">Dedicated role + confirmed purge</text>
<path class="line" d="M600 574V604"/><path class="line" d="M550 574V590H190V604"/><path class="line" d="M1010 574V604"/>
<text x="40" y="779" class="note">Diagnostics: allow-listed telemetry • no credentials or feedback bodies</text>
<text x="40" y="809" class="note">Separate gates: model-specific AI evidence, human calibration, cross-browser coverage and hosted deployment</text>
<text x="40" y="837" class="note">v0.2.0 • 2026-10-05 • the 10,000-record rules scenario does not expand the frozen model benchmark</text>
